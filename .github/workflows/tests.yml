name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: cargo test --locked --manifest-path receiver/Cargo.toml
      - run: cargo build --locked --release --manifest-path receiver/Cargo.toml
      - run: bash -n install.sh
      - run: python -m unittest discover -s tests -v
      - name: Real SSH integration
        run: |
          sudo mkdir -p /run/sshd
          sudo env TELEOPERATOR_RECEIVER="$PWD/receiver/target/release/hermes-teleoperator-receiver" "$(command -v python)" -m unittest discover -s tests -p test_real_ssh.py -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
