name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check out the official scanner at a reviewed revision
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: f0d94882e89ab8d4098b5bb2f166adfb9ee0a0ab
          path: .venv/hermes-validation
          persist-credentials: false
      - name: Scan the complete source checkout before building
        env:
          PYTHONPATH: ${{ github.workspace }}/.venv/hermes-validation
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.plugin_guard import scan_plugin
          result = scan_plugin(Path.cwd())
          print(result.summary)
          for finding in result.findings:
              print(finding)
          if result.verdict == 'dangerous':
              raise SystemExit('Official Hermes security scan failed')
          PY
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: cargo test --locked --manifest-path receiver/Cargo.toml
      - run: cargo build --locked --release --manifest-path receiver/Cargo.toml
      - run: bash -n install.sh
      - run: python scripts/sync_receiver_digests.py --check
      - run: python -m unittest discover -s tests -v
      - name: Real SSH integration
        run: |
          sudo mkdir -p /run/sshd
          sudo env TELEOPERATOR_RECEIVER="$PWD/receiver/target/release/hermes-teleoperator-receiver" "$(command -v python)" -m unittest discover -s tests -p test_real_ssh.py -v
      - name: Gateway-led deployment over real SSH
        run: |
          sudo env TELEOPERATOR_RECEIVER="$PWD/receiver/target/release/hermes-teleoperator-receiver" "$(command -v python)" -m unittest discover -s tests -p test_deploy.py -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
