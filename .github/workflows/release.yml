name: Receiver release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Full behavioural proof: gateway protocol, file transfer, skills, real SSH,
  # clean chroot. Runs on the reference targets only so the matrix stays cheap.
  test:
    runs-on: [self-hosted, Linux, X64, teleoperator]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y musl-tools gcc-aarch64-linux-gnu qemu-user-static openssh-server python3 python3-pip
      - name: Build static receiver (no Docker or binfmt registration)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --manifest-path receiver/Cargo.toml --target ${{ matrix.target }}
      - name: Native Rust and gateway integration tests
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          TELEOPERATOR_RECEIVER: ${{ github.workspace }}/receiver/target/x86_64-unknown-linux-musl/release/hermes-teleoperator-receiver
        run: |
          cargo test --locked --manifest-path receiver/Cargo.toml
          mkdir -p /run/sshd
          bash -n install.sh
          python3 scripts/sync_receiver_digests.py --check
          python3 -m unittest discover -s tests -v
      - name: Aarch64 receiver tests under QEMU
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          wrapper="$RUNNER_TEMP/aarch64-receiver"
          printf '#!/bin/sh\nexec /usr/bin/qemu-aarch64-static "%s" "$@"\n' "$PWD/receiver/target/aarch64-unknown-linux-musl/release/hermes-teleoperator-receiver" > "$wrapper"
          chmod 700 "$wrapper"
          export TELEOPERATOR_RECEIVER="$wrapper"
          python3 - <<'PY'
          import sys, unittest
          sys.path.insert(0, 'tests')
          import test_standalone_receiver as receiver
          # The chroot fixture deliberately contains no host QEMU executable.
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(receiver.StandaloneReceiverTests)
          selected = unittest.TestSuite(t for t in suite if t._testMethodName != 'test_clean_chroot_runs_without_python_or_hermes_installed')
          assert selected.countTestCases() == 8
          result = unittest.TextTestRunner(verbosity=2).run(selected)
          sys.exit(not result.wasSuccessful())
          PY

  # musl = fully static, no libc on the destination.
  # glibc = dynamic, pinned to a glibc 2.17 symbol floor so it also runs on
  # RHEL/CentOS 7-era systems. Same source, two linkage models.
  # GitHub-hosted runners only: provenance is attested to a runner GitHub owns.
  binary-linux:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            libc: musl
          - target: aarch64-unknown-linux-musl
            libc: musl
          - target: armv7-unknown-linux-musleabihf
            libc: musl
          - target: i686-unknown-linux-musl
            libc: musl
          - target: riscv64gc-unknown-linux-musl
            libc: musl
          - target: x86_64-unknown-linux-gnu
            libc: glibc
            glibc: "2.17"
          - target: aarch64-unknown-linux-gnu
            libc: glibc
            glibc: "2.17"
          - target: armv7-unknown-linux-gnueabihf
            libc: glibc
            glibc: "2.17"
          - target: i686-unknown-linux-gnu
            libc: glibc
            glibc: "2.17"
          - target: powerpc64le-unknown-linux-gnu
            libc: glibc
            # zig has no glibc older than 2.19 for ppc64le
            glibc: "2.19"
          - target: s390x-unknown-linux-gnu
            libc: glibc
            glibc: "2.17"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.24.1
      - name: Build (${{ matrix.libc }})
        run: |
          set -eu
          if [ "${{ matrix.libc }}" = "glibc" ]; then
            cargo zigbuild --locked --release --manifest-path receiver/Cargo.toml \
              --target "${{ matrix.target }}.${{ matrix.glibc }}"
          else
            cargo zigbuild --locked --release --manifest-path receiver/Cargo.toml \
              --target "${{ matrix.target }}"
          fi
      - name: Verify linkage
        run: |
          set -eu
          binary="receiver/target/${{ matrix.target }}/release/hermes-teleoperator-receiver"
          test -f "$binary"
          file "$binary"
          if [ "${{ matrix.libc }}" = "musl" ]; then
            if readelf -l "$binary" | grep -q INTERP; then
              echo 'musl release binary unexpectedly requires a dynamic interpreter' >&2
              exit 1
            fi
            echo 'musl: static, no PT_INTERP'
          else
            if ! readelf -l "$binary" | grep -q INTERP; then
              echo 'glibc release binary is unexpectedly static' >&2
              exit 1
            fi
            floor=$(objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -1 | sed 's/^GLIBC_//')
            echo "highest glibc symbol required: ${floor}"
            awk -v f="$floor" -v floor="${{ matrix.glibc }}" 'BEGIN { split(f, a, "."); split(floor, b, "."); exit !(a[1] < b[1] || (a[1] == b[1] && a[2] <= b[2])) }' \
              || { echo "binary needs glibc newer than the ${{ matrix.glibc }} floor" >&2; exit 1; }
          fi
      - name: Stage binaries
        run: |
          mkdir -p artifacts
          cp "receiver/target/${{ matrix.target }}/release/hermes-teleoperator-receiver" \
             "artifacts/hermes-teleoperator-receiver-${{ matrix.target }}"
          ls -l artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: receiver-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/hermes-teleoperator-receiver-${{ matrix.target }}

  # macOS needs a macOS linker and SDK, so it builds on a hosted arm64 runner.
  binary-apple:
    needs: test
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --manifest-path receiver/Cargo.toml --target ${{ matrix.target }}
      - name: Verify linkage
        run: |
          set -eu
          binary="receiver/target/${{ matrix.target }}/release/hermes-teleoperator-receiver"
          test -f "$binary"
          file "$binary"
          otool -L "$binary" | head -5
      - name: Stage binaries
        run: |
          mkdir -p artifacts
          cp "receiver/target/${{ matrix.target }}/release/hermes-teleoperator-receiver" \
             "artifacts/hermes-teleoperator-receiver-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: receiver-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/hermes-teleoperator-receiver-${{ matrix.target }}

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [binary-linux, binary-apple]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag, version and tagged commit
        run: |
          set -eu
          python3 - <<'PY'
          import os
          from hermes_teleoperator.version import VERSION

          tag = os.environ['GITHUB_REF_NAME']
          expected = 'v' + VERSION
          if tag != expected:
              raise SystemExit(f'release tag {tag} does not match VERSION {expected}')
          print(f'release tag {tag} matches VERSION {VERSION}')
          PY
          # actions/checkout checks out the tag's commit on a tag push. Refuse to
          # publish if that is not the commit GitHub associated with the ref.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo 'release checkout is not the tagged commit' >&2
            exit 1
          }
          git rev-parse HEAD
      - uses: actions/download-artifact@v4
        with:
          pattern: receiver-*
          merge-multiple: true
          path: artifacts
      - run: cd artifacts && sha256sum hermes-teleoperator-receiver-* > SHA256SUMS && cat SHA256SUMS
      - name: Refuse assets that differ from the source-pinned digests
        run: python3 scripts/verify_release_digests.py artifacts
      - name: Attest the published checksum manifest and assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
          body: |
            Standalone Rust receiver. No Hermes, Python, Bun or Node installation required on the destination.

            `*-linux-musl`: fully static. No libc, no dynamic loader on the destination.
            `*-linux-gnu`: dynamically linked, with a glibc 2.17 symbol floor (2.19 for powerpc64le). Matching CPU ABI and dynamic loader are also required.
            `*-apple-darwin`: macOS binaries; unsigned and not notarised, so Gatekeeper needs an override.

            Installers verify each asset against SHA256 digests committed in the plugin source for this tag. SHA256SUMS is published for completeness and cross-checked; it is not the trust root.

            Assets are built on GitHub-hosted runners and carry build provenance attestations. Verify with `gh attestation verify <asset> --repo Tsurgcom/hermes-teleoperator`.

            Built on GitHub-hosted Ubuntu 24.04 and macOS 15 runners. Only x86_64/aarch64 Linux plus native Rust tests are executed; other architectures are cross-compiled and the macOS binaries are built but not tested. Windows is not shipped: the receiver is Unix-only by design (openat/linkat/renameat file handling, Unix sockets, POSIX process groups, Bash).
