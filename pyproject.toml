[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-teleoperator"
version = "1.2.1"
description = "Conversation-scoped Hermes tool teleportation over SSH"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.entry-points."hermes_agent.plugins"]
hermes-teleoperator = "hermes_teleoperator.plugin:register"

[tool.setuptools.packages.find]
include = ["hermes_teleoperator*"]
