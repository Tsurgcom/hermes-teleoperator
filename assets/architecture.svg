<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 486" role="img" aria-labelledby="title desc">
<title id="title">Teleoperator architecture</title><desc id="desc">One gateway keeps the model and conversation. SSH channels connect it to on-demand companions on a workstation and server, each using standalone tool implementations and local credentials; no Hermes installation on the receiver.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#24271e" stroke-width="0.5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#ffd700" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="486" rx="12" fill="#10110f"/><rect width="1120" height="486" fill="url(#grid)"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><text x="36" y="48" font-size="22" fill="#ffd700" text-anchor="start">01 / ONE CONVERSATION. REMOTE NATIVE TOOLS.</text><path d="M418 221H526V176H638 M526 221V365H638" fill="none" stroke="#ffd700" stroke-width="2" marker-end="url(#arrow)"/><path d="M526 176H638" stroke="#ffd700" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="110" width="382" height="240" rx="5" fill="#1b1d18" stroke="#ffd700" stroke-width="2"/><text x="60" y="146" font-size="21" fill="#ffd700" text-anchor="start">GATEWAY / HERMES</text><text x="60" y="182" font-size="17" fill="#babdae" text-anchor="start">Model + conversation stay here</text><text x="60" y="210" font-size="17" fill="#babdae" text-anchor="start">Teleoperator plugin</text><text x="60" y="238" font-size="17" fill="#babdae" text-anchor="start">Select a destination</text><text x="60" y="266" font-size="17" fill="#babdae" text-anchor="start">Receive labelled tool results</text><text x="460" y="130" font-size="20" fill="#ffd700" text-anchor="start">SSH</text><text x="448" y="274" font-size="16" fill="#babdae" text-anchor="start">encrypted</text><text x="448" y="298" font-size="16" fill="#babdae" text-anchor="start">stdio</text><rect x="638" y="100" width="446" height="158" rx="5" fill="#1b1d18" stroke="#5f6154" stroke-width="2"/><text x="662" y="136" font-size="21" fill="#fafaf6" text-anchor="start">WORKSTATION</text><text x="662" y="172" font-size="17" fill="#babdae" text-anchor="start">Standalone Rust receiver</text><text x="662" y="200" font-size="17" fill="#babdae" text-anchor="start">Terminal · Files · Skills · MCP</text><text x="662" y="228" font-size="17" fill="#babdae" text-anchor="start">Credentials stay on this host</text><rect x="638" y="292" width="446" height="158" rx="5" fill="#1b1d18" stroke="#5f6154" stroke-width="2"/><text x="662" y="328" font-size="21" fill="#fafaf6" text-anchor="start">SERVER</text><text x="662" y="364" font-size="17" fill="#babdae" text-anchor="start">Standalone Rust receiver</text><text x="662" y="392" font-size="17" fill="#babdae" text-anchor="start">Terminal · Files · Skills · MCP</text><text x="662" y="420" font-size="17" fill="#babdae" text-anchor="start">Credentials stay on this host</text><text x="36" y="414" font-size="18" fill="#ffd700" text-anchor="start">NO EXTRA LISTENER</text><text x="36" y="445" font-size="16" fill="#babdae" text-anchor="start">Only SSH. No second conversation agent.</text></g></svg>