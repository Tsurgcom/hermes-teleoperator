<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 552" role="img" aria-labelledby="title desc">
<title id="title">Switching and failure behaviour</title><desc id="desc">Switch from local to workstation to server. Back returns to the previous machine and reuses its live connection. A lost connection never silently redirects commands to local; reconnect explicitly after checking the outcome.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#24271e" stroke-width="0.5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#ffd700" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="552" rx="12" fill="#10110f"/><rect width="1120" height="552" fill="url(#grid)"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><text x="36" y="48" font-size="22" fill="#ffd700" text-anchor="start">02 / SWITCH MACHINES. KEEP YOUR BEARINGS.</text><path d="M348 173H394 M726 173H772" fill="none" stroke="#ffd700" stroke-width="2" marker-end="url(#arrow)"/><rect x="36" y="98" width="312" height="150" rx="5" fill="#1b1d18" stroke="#5f6154" stroke-width="2"/><text x="60" y="134" font-size="21" fill="#fafaf6" text-anchor="start">LOCAL</text><text x="60" y="170" font-size="17" fill="#babdae" text-anchor="start">/teleport workstation</text><text x="60" y="198" font-size="17" fill="#babdae" text-anchor="start">Connect + verify identity</text><rect x="394" y="98" width="332" height="150" rx="5" fill="#1b1d18" stroke="#ffd700" stroke-width="2"/><text x="418" y="134" font-size="21" fill="#ffd700" text-anchor="start">WORKSTATION</text><text x="418" y="170" font-size="17" fill="#babdae" text-anchor="start">Native tools run here</text><text x="418" y="198" font-size="17" fill="#babdae" text-anchor="start">/teleport server</text><rect x="772" y="98" width="312" height="150" rx="5" fill="#1b1d18" stroke="#5f6154" stroke-width="2"/><text x="796" y="134" font-size="21" fill="#fafaf6" text-anchor="start">SERVER</text><text x="796" y="170" font-size="17" fill="#babdae" text-anchor="start">Native tools run here</text><text x="796" y="198" font-size="17" fill="#babdae" text-anchor="start">/teleport back</text><path d="M922 248V292H560V248" fill="none" stroke="#ffd700" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="741" y="321" font-size="16" fill="#babdae" text-anchor="middle">back reuses a live connection</text><rect x="36" y="356" width="1048" height="124" rx="5" fill="#1b1d18" stroke="#ffd700" stroke-width="2"/><text x="60" y="392" font-size="21" fill="#ffd700" text-anchor="start">CONNECTION LOST? STOP HERE.</text><text x="60" y="428" font-size="17" fill="#babdae" text-anchor="start">Remote stays selected. No silent local fallback.</text><text x="60" y="456" font-size="17" fill="#babdae" text-anchor="start">Inspect the outcome, then reconnect explicitly. Reconnect starts a fresh shell.</text><text x="36" y="521" font-size="17" fill="#babdae" text-anchor="start">Selection is per conversation. Live connections keep their shell state.</text></g></svg>